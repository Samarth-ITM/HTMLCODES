<!DOCTYPE html>
<html>
<head>
    <title>GPS Location Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body onclick="removeCSS()">

    <!-- Animated Background Shapes -->
    <div class="shape a"></div>
    <div class="shape b"></div>

    <!-- Floating Rectangles & Shapes -->
    <div class="dot dot1"></div>
    <div class="dot dot2"></div>
    <div class="dot dot3"></div>
    <div class="dot dot4"></div>
    <div class="dot dot5"></div>
    <div class="dot dot6"></div>

    <!-- Decorative Sharp Rings -->
    <div class="ring ring1"></div>
    <div class="ring ring2"></div>
    <div class="ring ring3"></div>
    <div class="ring ring4"></div>

    <!-- Jagged Lines -->
    <div class="glow-line glow-line1"></div>
    <div class="glow-line glow-line2"></div>

    <!-- Jagged Pinpoints -->
    <div class="pinpoint pinpoint1"></div>
    <div class="pinpoint pinpoint2"></div>

    <!-- Main Card -->
    <div class="box">
        <h2>Find Location</h2>
        <button onclick="loc(); event.stopPropagation();">Click Here</button>
        <p id="out"></p>
    </div>

    <script>
        function loc() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(show);
            }
        }

        function show(p) {
            var t = document.getElementById("out");
            t.innerHTML = "Lat: " + p.coords.latitude.toFixed(4) + " | Lon: " + p.coords.longitude.toFixed(4);
            t.classList.add("show");
        }

        function removeCSS() {
            document.body.classList.add("no-css");
        }

        // Animate shapes
        setInterval(function() {
            if (!document.body.classList.contains("no-css")) {
                var x = Math.floor(Math.random() * 50) - 25;
                var y = Math.floor(Math.random() * 50) - 25;
                var aElem = document.querySelector(".a");
                var bElem = document.querySelector(".b");
                if (aElem) aElem.style.left = 60 + x + "px";
                if (bElem) bElem.style.top = 80 + y + "px";
            }
        }, 2500);
    </script>

</body>
</html>
