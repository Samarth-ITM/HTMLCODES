<!DOCTYPE html>
<html>
<head>
  <title>Spinning rod</title>
</head>
<body style="margin:0">
<svg width="100%" height="100vh">

  <rect x="600" y="394"
        width="300" height="12"
        rx="6" ry="6"
        fill="black" opacity="0.8">
    <animateTransform
      attributeName="transform"
      type="rotate"
      from="0 750 400"
      to="360 750 400"
      dur="2s"
      repeatCount="indefinite">
    </animateTransform>
  </rect>

  <circle cx="750" cy="400" r="100"
          fill="green" opacity="0.5"/>

</svg>
</body>
</html>
