<!DOCTYPE html>
<html lang="en">
<head>
    <title>Ball</title>
    <style>
        #circle{
            box-shadow: 10 10 20px rgb(0, 0, 0);
        }

    </style>
</head>
<body style="margin: 0;">
    <svg width="100%" height="100vh" style="border: 1px solid black">
      <circle id="circle" cx="300" cy="390" r="40" fill="red">

        <animate
        attributeName="cx"
        from="100"
        to="500"
        dur="2s"
        repeatCount="indefinite" />

        <animate
        attributeName="cy"
        values="100;500;100;"
        dur="2s"
        repeatCount="indefinite" />

        </circle>
    </svg>
</body>
</html>
