<!DOCTYPE html>
<html>
<head>
<title>FlexDash</title>
<link rel="stylesheet" href="style.css">
</head>
<body>


<header class="top">
    <div class="logo">FlexDash</div>
    <input class="search" placeholder="Search dashboard..." />
    <div class="ad">
        <button type="button" id = "btn">Admin</button>
    </div>
</header>

<div class="container">
    <aside class="sidebar">
        <a class="link">Dashboard</a>
        <a class="link">Analytics</a>
        <a class="link">Users</a>
        <a class="link">Reports</a>
        <a class="link">Settings</a>
    </aside>

    <main class="main">

        <div class="stats" id ='up'>
            <div class="card">Users<br><b>1,240</b></div>
            <div class="card">Revenue<br><b>₹2.4L</b></div>
            <div class="card">Orders<br><b>320</b></div>
        </div>

        <div class="stats">
            <div class="blue-card">Growth<br><b>+18%</b></div>
            <div class="blue-card">Conversion<br><b>5.4%</b></div>
        </div>

    </main>
</div>

<footer class="footer">© 2026 Flexbox Dashboard - Student Practical Task</footer>
</body>
</html>
