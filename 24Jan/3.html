<!DOCTYPE html>
<html>
<head>
<style>
  .card:hover .rekt {
    transition: transform 1s;
    transform: translateY(-10px);

  }

  .card:hover .circle {
    transition: transform 1s;
    transform: translateY(-20px);

  }

  .card:hover .line {
    transition: transform 1s;
    transform: translate(-30px, -50px);
  }
  .card:hover .line2 {
    transition: transform 1s;
    transform: translate(30px, -50px);
  }

  .card:hover .line1 {
    transition: transform 1s;
    transform: translate(5px);
  }

</style>
</head>

<body style="margin: 0;">

<div class="card">
  <svg width="100%" height="100vh">

    <rect class="rekt" x="80" y="80" width="40" height="70" fill="green" rx="10" ry="10"/>

    <circle class="circle" cx="100" cy="60" r="20" fill="blue"/>

    <line class="line" x1="60" y1="60" x2="80" y2="100" stroke="black" stroke-width="5"/>

    <line class="line2" x1="130" y1="60" x2="120" y2="100" stroke="black" stroke-width="5"/>

    <line class="line1" x1="110" y1="150" x2="120" y2="190" stroke="black" stroke-width="5"/>

    <line class="line1" x1="90" y1="150" x2="100" y2="190" stroke="black" stroke-width="5"/>




  </svg>
</div>
</body>
</html>
