<html>
<head>
    <title>Response Recorded</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Verdana, sans-serif;
            background-image: url("images.jpeg");
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }


        .bigbox {
            max-width: 900px;
            margin: 80px auto;
            background-color: deepskyblue;
            border-radius: 25px;
            padding: 40px;
            box-shadow: 2px 5px 10px rgba(0, 0, 0, 0.5);
            border-top: 20px solid #73AD21;
            border-left: 8px solid blueviolet;
        }


        .card {
            background-color: lightyellow;
            padding: 50px;
            border-radius: 15px;
            text-align: center;
            border-left: 8px solid blueviolet;
            border-bottom: 3px solid black;
            border-right: 3px solid black;
        }


        #h1 {
            margin-bottom: 20px;
            color: #000;
        }


        .msg-text {
            font-size: 16px;
            margin-bottom: 30px;
        }


        .refill-link {
            display: inline-block;
            text-decoration: none;
            background-color: #1a73e8;
            color: white;
            padding: 15px 25px;
            border-radius: 5px;
            font-size: 14px;
            font-weight: 500;
        }

        .refill-link:hover {
            background-color: #1558c0;
        }
    </style>
</head>

<body>

    <div class="bigbox">
        <div class="card">
            <h1 id="h1">Response Recorded</h1>

            <p class="msg-text">
                Your response has been successfully submitted.
            </p>

            <p class="msg-text">
                If you want to submit another response, Click the button below!
            </p>

            <a href="index.html" class="refill-link">
                Re-fill the form
            </a>
        </div>
    </div>

</body>
</html>
