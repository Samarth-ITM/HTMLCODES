<!DOCTYPE html>
<html>
<head>
<style>
  .card:hover .rekt {
    transition: transform 1s;
    transform: translate(0px, -15px);
    fill:lightgreen;
  }

  .card:hover .circle {
    transition: transform 1s;
    transform: translate(20px, 0px);
    fill:lightblue;
  }

  .card:hover .line {
    transition: transform 1s;

    transform: translate(20px, 0px);
  }

  .card:hover .ball {
    transition: transform 1s;
    transform: translateX(400px);
  }
</style>
</head>

<body style="margin: 0;">

<div class="card">
  <svg width="100%" height="100vh">

    <rect class="rekt" x="40" y="40" width="60" height="40" fill="green" />

    <circle class="circle" cx="200" cy="60" r="20" fill="blue"/>

    <line class="line" x1="360" y1="50" x2="420" y2="90" stroke="black" stroke-width="5"/>

    <circle class="ball" cx="60" cy="200" r="10" fill="yellow"/>

  </svg>
</div>
</body>
</html>
