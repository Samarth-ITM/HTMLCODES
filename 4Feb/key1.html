<!DOCTYPE html>
<html lang="en">
<head>
    <title>Document</title>
    <style>
        .box{
            width: 100px;
            height: 100px;
            background: red;
            position: relative;
            animation: move 3s infinite alternate;
        }
        @keyframes move{
            from {bottom: 100px;}
            to {bottom: -100px;}
        }
    </style>
</head>
<body>
    <div class="box"></div>
</body>
</html>
