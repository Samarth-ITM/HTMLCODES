<!DOCTYPE html>
<html lang="en">
<head>
<style>
    *{
        border: 2px solid black;
        background-color: #000000;
    }


    :root{
        --bg-color: #ffffff;
        --text-color: #000000;
        --card-color: #f2f2f2;
    }

    body.dark{
        --bg-color: blue;
        --text-color: yellow;
        --card-color: red;
    }

    body.light{
        --bg-color: violet;
        --text-color: indigo;
        --card-color: pink;
    }

    body p {
        background-color: var(--bg-color);
        color: var(--text-color);
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 20px;
        transition: 0.3s;
    }
    .card{
        background-color: var(--card-color);
        padding: 20px;
        border-radius: 8px;
        margin-top: 20px;
    }

    button{
        padding: 10px 15px;
        cursor: pointer;
        border: 2px solid black;
        border-radius: 5px;
        background-color: white;
    }

</style>
</head>
<body>
    <div class="wp">
    <h1 style="color: blue;">This Samarth's Landing Page</h1>
    <p>My landing Page</p>
    <br><br>

    <button onclick="toggleTheme()">Toggle Theme for the content above and below</button>
    <button onclick="toggleThemeP()">Toggle Theme for the entire page</button>
    <button onclick="btn()">Toggle Theme for the entire page</button>

    <div class="card">
        <p>This is landing page.</p>
    </div>

    <div class="card">
        <p>This is not the landing page.</p>
    </div>


</div>
    <script>

        function btn(){
            document.documentElement.style.setProperty("--bg-color","lightblue")

        }
        function toggleTheme(){
            document.body.classList.toggle("dark");
            
        }

        function toggleThemeP(){
            document.body.classList.toggle("light");
            
        }


    </script>
</body>
</html>
