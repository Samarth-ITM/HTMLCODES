<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/jpeg" href="../assets/landing/brandinglogo.jpg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enter the Arena — Quiz Tournament</title>
    <link rel="stylesheet" href="../base.css">
    <link rel="stylesheet" href="start.css">
</head>
<body>
    <div class="start-card">
        <div class="start-icon">🏟️</div>
        <h1 class="start-title">Enter the Arena</h1>
        <p class="start-sub">Compete across 4 rounds. Score enough points to advance each stage.</p>

        <div class="rules-box">
            <p class="rules-heading">⚠️ Tournament Rules</p>
            <ul class="rules-list">
                <li>The quiz enforces <strong>fullscreen mode</strong></li>
                <li>Do not switch tabs or exit fullscreen</li>
                <li>You will be <strong>disqualified instantly</strong> on any violation</li>
            </ul>
        </div>

        <div class="start-meta">
            <span class="meta-label">Attempts Remaining</span>
            <span class="meta-value" id="startAttempts">—</span>
        </div>

        <button class="btn-cta" onclick="window.location.href='quiz.html'">Begin Tournament</button>
    </div>

    <script src="../base.js"></script>
    <script>
        const p = getCurrentPlayer();
        if (!p || p.attemptsUsed >= MAX_ATTEMPTS) {
            window.location.href = '../register/register.html';
        } else {
            document.getElementById('startAttempts').textContent = MAX_ATTEMPTS - p.attemptsUsed;
        }
    </script>
</body>
</html>
