<!DOCTYPE html>
<html>
<head>
    <title>Bouncing ball under rectangle</title>
    <style>
        #r1{
    filter: drop-shadow(7px 7px 6px #333);
        }
    </style>
</head>
<body style="margin: 0;">
    <svg width="100%" height="100vh">

    <rect id ="r1" x="425" y="200" width="600" height="200" fill="blue" rx="40px" ry="40px">
    </rect>
        <circle cx="725" cy="500" r="60" fill="green">
            <animate attributeName="cy"
                    values="600;500;600;500;600"
                    dur="3s"
                    repeatCount="indefinite">
            </animate>
        </circle>

    </svg>
</body>
</html>
